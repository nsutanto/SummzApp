name: iOS CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  ios-build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: |
          ios/Pods
          ~/Library/Caches/CocoaPods
          ~/.cocoapods
        key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Install npm dependencies
      run: |
        # Use legacy peer deps to resolve @rneui conflicts with react-native-safe-area-context
        echo "Installing npm dependencies with --legacy-peer-deps..."
        npm install --legacy-peer-deps
        echo "✅ npm dependencies installed successfully"

    - name: Install CocoaPods
      run: |
        cd ios
        pod install

    - name: Build iOS for Simulator
      run: |
        cd ios
        echo "=== Building iOS for Simulator ==="
        xcodebuild -workspace SummzApp.xcworkspace \
          -scheme SummzApp \
          -configuration Debug \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -derivedDataPath DerivedData \
          build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE=""

    - name: Generate iOS Bundle
      run: |
        echo "=== iOS Bundle Generation ==="
        npx react-native bundle \
          --platform ios \
          --dev false \
          --entry-file index.js \
          --bundle-output ios.bundle \
          --sourcemap-output ios.bundle.map

        echo "iOS bundle size: $(du -h ios.bundle | cut -f1)"

        if [ -f ios.bundle ]; then
          echo "✅ iOS bundle generated successfully"
        else
          echo "❌ iOS bundle generation failed"
          exit 1
        fi

    - name: Archive iOS Build Products
      run: |
        cd ios
        if [ -d "DerivedData/Build/Products/Debug-iphonesimulator" ]; then
          echo "Creating iOS build archive..."
          tar -czf ../ios-build-products.tar.gz DerivedData/Build/Products/Debug-iphonesimulator/SummzApp.app
          echo "✅ iOS build products archived"
        else
          echo "❌ iOS build products not found"
          exit 1
        fi

    - name: Upload iOS Build Products
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-products
        path: ios-build-products.tar.gz
        retention-days: 7

    - name: Upload iOS Bundle
      uses: actions/upload-artifact@v4
      with:
        name: ios-bundle
        path: ios.bundle
        retention-days: 7

    - name: Upload iOS build logs (if failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-logs
        path: ios/DerivedData/Logs/Build
        retention-days: 7

    - name: Build Summary
      if: always()
      run: |
        echo "=== iOS Build Summary ==="
        if [ -f "ios-build-products.tar.gz" ]; then
          BUILD_SIZE=$(du -h ios-build-products.tar.gz | cut -f1)
          echo "✅ iOS App Build: Success (${BUILD_SIZE})"
        else
          echo "❌ iOS App Build: Failed"
        fi

        if [ -f "ios.bundle" ]; then
          BUNDLE_SIZE=$(du -h ios.bundle | cut -f1)
          echo "✅ Bundle Generation: Success (${BUNDLE_SIZE})"
        else
          echo "❌ Bundle Generation: Failed"
        fi

        echo "📱 Platform: iOS"
        echo "🏗️  Build Type: Debug (Simulator)"
        echo "⚡ Node.js: $(node --version)"
        echo "🍎 Xcode: $(xcodebuild -version | head -n 1)"
        echo "🤖 React Native: $(npx react-native --version | head -n 1)"

        # CocoaPods info
        cd ios
        if [ -f "Podfile.lock" ]; then
          POD_COUNT=$(grep -c "SPEC CHECKSUMS:" -A 1000 Podfile.lock | grep -c ":")
          echo "📦 CocoaPods: ${POD_COUNT} dependencies installed"
        fi
