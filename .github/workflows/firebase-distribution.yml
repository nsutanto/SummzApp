name: Build and Distribute Android to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Cache Android dependencies for faster builds
    - name: Cache Android dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Install dependencies (exactly like android-ci.yml)
    - name: Install npm dependencies
      run: |
        # Use legacy peer deps to resolve @rneui conflicts with react-native-safe-area-context
        echo "Installing npm dependencies with --legacy-peer-deps..."
        npm install --legacy-peer-deps
        echo "✅ npm dependencies installed successfully"

    # Prepare Android Codegen (exactly like android-ci.yml)
    - name: Prepare Android Codegen
      run: |
        echo "Cleaning Android build artifacts..."
        rm -rf android/app/build android/build

        echo "Creating required codegen directories..."
        mkdir -p "node_modules/@react-native-async-storage/async-storage/android/build/generated/source/codegen/jni"
        mkdir -p "node_modules/@react-native-google-signin/google-signin/android/build/generated/source/codegen/jni"
        mkdir -p "node_modules/react-native-gesture-handler/android/build/generated/source/codegen/jni"
        mkdir -p "node_modules/react-native-vector-icons/android/build/generated/source/codegen/jni"
        mkdir -p "node_modules/react-native-safe-area-context/android/build/generated/source/codegen/jni"
        mkdir -p "node_modules/react-native-screens/android/build/generated/source/codegen/jni"

        echo "Creating CMakeLists.txt files..."
        for lib in "@react-native-async-storage/async-storage" "@react-native-google-signin/google-signin" "react-native-gesture-handler" "react-native-vector-icons" "react-native-safe-area-context" "react-native-screens"; do
          echo "# Minimal CMakeLists.txt for autolinking compatibility" > "node_modules/$lib/android/build/generated/source/codegen/jni/CMakeLists.txt"
          echo "cmake_minimum_required(VERSION 3.13)" >> "node_modules/$lib/android/build/generated/source/codegen/jni/CMakeLists.txt"
        done

    # Create release keystore from secrets
    - name: Setup Release Keystore
      run: |
        echo "Setting up release keystore for production build..."
        if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "❌ ANDROID_KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        
        # Decode and create release keystore
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
        
        # Verify keystore was created
        if [ -f "android/app/release.keystore" ]; then
          echo "✅ Release keystore created successfully"
        else
          echo "❌ Failed to create release keystore"
          exit 1
        fi

    # Build Android Release APK (similar to android-ci.yml but for release)
    - name: Build Android Release APK
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace

    # Verify APK was built (similar to android-ci.yml)
    - name: Verify Release APK
      run: |
        echo "=== Build Verification ==="
        if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          APK_SIZE=$(du -h android/app/build/outputs/apk/release/app-release.apk | cut -f1)
          echo "✅ Release APK built successfully (${APK_SIZE})"
          
          # Additional APK info
          echo "APK details:"
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          
          # Verify APK is signed
          if aapt dump badging android/app/build/outputs/apk/release/app-release.apk | grep -q "package:"; then
            echo "✅ APK is properly signed and ready for distribution"
          else
            echo "⚠️  Warning: APK verification failed"
          fi
        else
          echo "❌ Release APK not found"
          echo "Available files in outputs/apk/release/:"
          ls -la android/app/build/outputs/apk/release/ || echo "Directory not found"
          exit 1
        fi

    # Distribute to Firebase App Distribution
    - name: Distribute to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: testers
        file: android/app/build/outputs/apk/release/app-release.apk
        releaseNotes: |
          🚀 New SummzApp build available for testing!
          
          📝 Latest Changes: ${{ github.event.head_commit.message }}
          🔗 Commit: ${{ github.sha }}
          👤 Author: ${{ github.actor }}
          📅 Build Date: ${{ github.event.head_commit.timestamp }}
          🏗️  Build Type: Release APK
          🌿 Branch: ${{ github.ref_name }}
          
          Please test the new features and report any issues.

    # Upload APK as artifact (backup)
    - name: Upload Release APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    # Final Summary
    - name: Distribution Summary
      if: always()
      run: |
        echo "=== Firebase Distribution Summary ==="
        if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          APK_SIZE=$(du -h android/app/build/outputs/apk/release/app-release.apk | cut -f1)
          echo "✅ Release APK: Successfully built and distributed (${APK_SIZE})"
        else
          echo "❌ Release APK: Build failed"
        fi
        
        echo "📱 Platform: Android"
        echo "🏗️  Build Type: Release"
        echo "🚀 Distribution: Firebase App Distribution"
        echo "👥 Target Group: testers"
        echo "🌿 Branch: ${{ github.ref_name }}"
        echo "📝 Commit: ${{ github.sha }}"