name: Build and Distribute Android to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Install dependencies
    - name: Install dependencies
      run: npm install

    # Run React Native Codegen and create missing directories
    - name: Run React Native Codegen
      run: |
        # Clean any existing autolinking configuration that might have absolute paths
        echo "Cleaning autolinking configuration..."
        rm -rf android/app/build/generated/autolinking
        
        # Run codegen - ignore exit code 1 as it's a known React Native CLI issue but artifacts are still generated
        echo "Running React Native codegen..."
        npx @react-native-community/cli codegen || true
        
        # Verify that main codegen artifacts were created
        echo "=== Main codegen artifacts ==="
        ls -la android/app/build/generated/source/codegen/ || echo "Main codegen directory not found"
        
        echo "Codegen setup completed successfully"

    - name: Regenerate Android autolinking
      run: |
        cd android
        echo "Regenerating autolinking configuration..."
        ./gradlew generateCodegenArtifactsFromSchema
        
        # Check the generated autolinking file
        echo "=== Generated autolinking file ==="
        if [ -f "app/build/generated/autolinking/src/main/jni/Android-autolinking.cmake" ]; then
          echo "✓ Autolinking file generated"
          head -20 app/build/generated/autolinking/src/main/jni/Android-autolinking.cmake
        else
          echo "✗ Autolinking file not found"
        fi

    # Create keystore from secret
    - name: Create keystore file
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

    # Clean and Build Android APK
    - name: Clean and Build Android APK
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleRelease

    # Distribute to Firebase
    - name: Distribute to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: testers
        file: android/app/build/outputs/apk/release/app-release.apk
        releaseNotes: |
          🚀 New build available!
          
          📝 Changes: ${{ github.event.head_commit.message }}
          🔗 Commit: ${{ github.sha }}
          👤 Author: ${{ github.actor }}
          📅 Built: ${{ github.event.head_commit.timestamp }}
