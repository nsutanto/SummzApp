name: Build and Distribute Android to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Cache Android dependencies for faster builds
    - name: Cache Android dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Clean and prepare React Native build environment
    - name: Clean and Prepare Build Environment
      run: |
        echo "🧹 Cleaning previous build artifacts..."
        rm -rf node_modules/ android/app/build/ android/build/ android/app/.cxx
        
        echo "📦 Installing dependencies with legacy peer deps..."
        npm install --legacy-peer-deps
        
        echo "✅ Build environment cleaned and dependencies installed"

    # Generate React Native Codegen
    - name: Generate React Native Codegen
      run: |
        echo "🔧 Generating React Native codegen for all native modules..."
        
        # Run React Native codegen to generate required JNI files
        npx react-native codegen || echo "Codegen completed with warnings"
        
        # Ensure codegen directories exist for problematic packages
        echo "📁 Creating codegen directories for native modules..."
        packages=(
          "@react-native-async-storage/async-storage"
          "@react-native-google-signin/google-signin"
          "react-native-gesture-handler"
          "react-native-vector-icons"
          "react-native-safe-area-context" 
          "react-native-screens"
        )
        
        for package in "${packages[@]}"; do
          codegen_dir="node_modules/$package/android/build/generated/source/codegen/jni"
          if [ ! -d "$codegen_dir" ]; then
            echo "📁 Creating codegen directory for $package"
            mkdir -p "$codegen_dir"
            
            # Create minimal files to satisfy autolinking
            touch "$codegen_dir/.gitkeep"
            
            # Create minimal CMakeLists.txt
            echo "# Auto-generated CMakeLists.txt for React Native autolinking" > "$codegen_dir/CMakeLists.txt"
            echo "cmake_minimum_required(VERSION 3.13)" >> "$codegen_dir/CMakeLists.txt"
            echo "# This file satisfies autolinking requirements" >> "$codegen_dir/CMakeLists.txt"
          fi
        done
        
        echo "✅ Codegen generation completed"

    # Prepare Android Build Environment
    - name: Prepare Android Build Environment
      run: |
        echo "🔧 Preparing Android build environment..."
        
        echo "🧹 Cleaning Android build cache..."
        cd android
        chmod +x gradlew
        ./gradlew clean
        
        # Let Gradle handle autolinking and codegen during build
        echo "🔗 Initializing autolinking..."
        ./gradlew generateAutolinkingPackageList || echo "Autolinking initialized"
        
        echo "✅ Android build environment prepared"

    # Verify Build Environment
    - name: Verify Build Environment
      run: |
        echo "🔍 Verifying build environment..."
        
        # Check Gradle wrapper
        if [ -f "android/gradlew" ]; then
          echo "✅ Gradle wrapper found"
          ls -la android/gradlew
        else
          echo "❌ Gradle wrapper not found"
          exit 1
        fi
        
        # Check Android SDK
        echo "� Android SDK: $ANDROID_HOME"
        echo "☕ Java version: $(java -version 2>&1 | head -n 1)"
        echo "🎯 Node version: $(node --version)"
        
        echo "✅ Build environment verified"

    # Create release keystore from secrets
    - name: Setup Release Keystore
      run: |
        echo "Setting up release keystore for production build..."
        if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "❌ ANDROID_KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        
        # Decode and create release keystore
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
        
        # Verify keystore was created
        if [ -f "android/app/release.keystore" ]; then
          echo "✅ Release keystore created successfully"
        else
          echo "❌ Failed to create release keystore"
          exit 1
        fi

    # Build Android Release APK
    - name: Build Android Release APK
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        cd android
        chmod +x gradlew

        echo "Building Android release APK for Firebase Distribution..."
        ./gradlew clean assembleRelease --stacktrace

        echo "=== Build Verification ==="
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          APK_SIZE=$(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)
          echo "✅ Release APK built successfully (${APK_SIZE})"
          
          # Additional APK info
          echo "APK details:"
          ls -lh app/build/outputs/apk/release/app-release.apk
          
          # Verify APK is signed
          if aapt dump badging app/build/outputs/apk/release/app-release.apk | grep -q "package:"; then
            echo "✅ APK is properly signed and ready for distribution"
          else
            echo "⚠️  Warning: APK verification failed"
          fi
        else
          echo "❌ Release APK not found"
          echo "Available files in outputs/apk/release/:"
          ls -la app/build/outputs/apk/release/ || echo "Directory not found"
          exit 1
        fi

    # Distribute to Firebase App Distribution
    - name: Distribute to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: testers
        file: android/app/build/outputs/apk/release/app-release.apk
        releaseNotes: |
          🚀 New SummzApp build available for testing!
          
          📝 Latest Changes: ${{ github.event.head_commit.message }}
          🔗 Commit: ${{ github.sha }}
          👤 Author: ${{ github.actor }}
          📅 Build Date: ${{ github.event.head_commit.timestamp }}
          🏗️  Build Type: Release APK
          🌿 Branch: ${{ github.ref_name }}
          
          Please test the new features and report any issues.

    # Upload APK as artifact (backup)
    - name: Upload Release APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    # Final Summary
    - name: Distribution Summary
      if: always()
      run: |
        echo "=== Firebase Distribution Summary ==="
        if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          APK_SIZE=$(du -h android/app/build/outputs/apk/release/app-release.apk | cut -f1)
          echo "✅ Release APK: Successfully built and distributed (${APK_SIZE})"
        else
          echo "❌ Release APK: Build failed"
        fi
        
        echo "📱 Platform: Android"
        echo "🏗️  Build Type: Release"
        echo "🚀 Distribution: Firebase App Distribution"
        echo "👥 Target Group: testers"
        echo "🌿 Branch: ${{ github.ref_name }}"
        echo "📝 Commit: ${{ github.sha }}"
