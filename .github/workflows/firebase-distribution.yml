name: Build and Distribute Android to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Install dependencies
    - name: Install dependencies
      run: npm install

    # Run React Native Codegen and create missing directories
    - name: Run React Native Codegen
      run: |
        # Run codegen - ignore exit code 1 as it's a known React Native CLI issue but artifacts are still generated
        npx @react-native-community/cli codegen || true
        
        # Create directories and CMakeLists.txt files for each library
        echo "Creating codegen directories..."
        for lib in "@react-native-async-storage/async-storage" "@react-native-google-signin/google-signin" "react-native-gesture-handler" "react-native-vector-icons" "react-native-safe-area-context" "react-native-screens"; do
          echo "Creating directory for: $lib"
          mkdir -p "node_modules/$lib/android/build/generated/source/codegen/jni/"
          echo "Created directory: node_modules/$lib/android/build/generated/source/codegen/jni/"
          
          # Create CMakeLists.txt file
          echo "# Minimal CMakeLists.txt for autolinking compatibility" > "node_modules/$lib/android/build/generated/source/codegen/jni/CMakeLists.txt"
          echo "cmake_minimum_required(VERSION 3.13)" >> "node_modules/$lib/android/build/generated/source/codegen/jni/CMakeLists.txt"
          echo "# This file exists to satisfy autolinking requirements" >> "node_modules/$lib/android/build/generated/source/codegen/jni/CMakeLists.txt"
          echo "# Actual codegen is handled centrally in android/app/build/generated/source/codegen" >> "node_modules/$lib/android/build/generated/source/codegen/jni/CMakeLists.txt"
          echo "Created CMakeLists.txt for: $lib"
        done
        
        # Verify that directories were created
        echo "=== Verification ==="
        for lib in "@react-native-async-storage/async-storage" "@react-native-google-signin/google-signin" "react-native-gesture-handler" "react-native-vector-icons" "react-native-safe-area-context" "react-native-screens"; do
          if [ -d "node_modules/$lib/android/build/generated/source/codegen/jni/" ]; then
            echo "✓ Directory exists: node_modules/$lib/android/build/generated/source/codegen/jni/"
            if [ -f "node_modules/$lib/android/build/generated/source/codegen/jni/CMakeLists.txt" ]; then
              echo "✓ CMakeLists.txt exists: node_modules/$lib/android/build/generated/source/codegen/jni/CMakeLists.txt"
            else
              echo "✗ CMakeLists.txt missing: node_modules/$lib/android/build/generated/source/codegen/jni/CMakeLists.txt"
            fi
          else
            echo "✗ Directory missing: node_modules/$lib/android/build/generated/source/codegen/jni/"
          fi
        done
        
        # Also check main codegen artifacts
        echo "=== Main codegen artifacts ==="
        ls -la android/app/build/generated/source/codegen/ || echo "Main codegen directory not found"
        echo "Codegen setup completed successfully"

    # Create keystore from secret
    - name: Create keystore file
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

    # Clean and Build Android APK
    - name: Clean and Build Android APK
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleRelease

    # Distribute to Firebase
    - name: Distribute to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: testers
        file: android/app/build/outputs/apk/release/app-release.apk
        releaseNotes: |
          🚀 New build available!
          
          📝 Changes: ${{ github.event.head_commit.message }}
          🔗 Commit: ${{ github.sha }}
          👤 Author: ${{ github.actor }}
          📅 Built: ${{ github.event.head_commit.timestamp }}
