name: Build and Distribute Android to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Install dependencies
    - name: Install dependencies
      run: npm install

    # Clean and run React Native Codegen for Android
    - name: Clean and run React Native Codegen for Android
      run: |
        # Clean node_modules and reinstall to ensure fresh state
        echo "Cleaning node_modules..."
        rm -rf node_modules
        npm install
        
        # Clean any existing build artifacts
        echo "Cleaning Android build artifacts..."
        rm -rf android/app/build
        rm -rf android/build
        
        # Generate Android codegen artifacts only
        echo "Generating Android codegen artifacts..."
        mkdir -p android/app/build/generated/source/codegen/jni
        mkdir -p android/app/build/generated/source/codegen/java
        
        # Run codegen specifically for Android libraries we use
        echo "Running codegen for Android libraries..."
        npx @react-native-community/cli codegen --platform android || {
          echo "Codegen command failed, trying alternative approach..."
          
          # Alternative: Let the Android build process handle codegen
          echo "Will let Android Gradle build handle codegen generation"
        }
        
        # Verify Android codegen artifacts
        echo "=== Android codegen verification ==="
        if [ -d "android/app/build/generated/source/codegen" ]; then
          echo "✓ Android codegen directory exists"
          ls -la android/app/build/generated/source/codegen/
        else
          echo "⚠️ Codegen directory not found - will be generated during Android build"
        fi
        
        echo "Android codegen step completed"

    # Create keystore from secret
    - name: Create keystore file
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

    # Build Android APK
    - name: Build Android APK
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        cd android
        chmod +x gradlew
        
        # Clean and build Android release APK
        echo "Building Android release APK..."
        ./gradlew clean assembleRelease
        
        # Verify APK was created
        echo "=== Build verification ==="
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          echo "✓ APK built successfully"
          ls -lh app/build/outputs/apk/release/app-release.apk
        else
          echo "✗ APK not found"
          exit 1
        fi

    # Distribute to Firebase
    - name: Distribute to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: testers
        file: android/app/build/outputs/apk/release/app-release.apk
        releaseNotes: |
          🚀 New build available!
          
          📝 Changes: ${{ github.event.head_commit.message }}
          🔗 Commit: ${{ github.sha }}
          👤 Author: ${{ github.actor }}
          📅 Built: ${{ github.event.head_commit.timestamp }}
